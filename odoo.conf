[options]
; ===== Cấu hình Odoo cho Railway =====
; Dữ liệu (filestore, session) -> phải nằm trên VOLUME của Railway, nếu không sẽ mất khi redeploy.
data_dir = /var/lib/odoo

; ĐỔI mật khẩu master này trước khi deploy (dùng để quản trị database).
admin_passwd = DOI_MAT_KHAU_MANH_O_DAY

; Đường dẫn addons: module custom + core của image odoo:19
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Chỉ chạy 1 database, ẩn trang quản lý DB cho an toàn
list_db = False

; Chạy sau reverse proxy của Railway (HTTPS) -> bắt buộc bật
proxy_mode = True

; Railway chỉ mở 1 cổng -> chạy chế độ threaded (workers=0) cho đơn giản, đủ cho event site nhỏ.
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
